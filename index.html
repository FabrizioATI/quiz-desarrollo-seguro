const RES={1:"<h1><strong>1. Seguridad en el ciclo de vida de desarrollo de software (SDLC)</strong></h1><h2><strong>Desarrollo seguro de software</strong></h2><ul><li>Fundamental para construir aplicaciones resilientes.</li><li>Se enfoca en prevenir antes de que pase el problema (proactivo).</li><li>Se denomina <strong>Secure SDLC</strong>.</li><li>Busca identificar y mitigar vulnerabilidades lo antes posible, reduciendo:<ul><li>Costos</li><li>Riesgos</li></ul></li><li>Para lograrlo, incorpora actividades y controles de seguridad en <strong>todas</strong> las etapas, desde la concepción hasta el retiro del software.</li><li>Marcos que lo guían: <strong>OWASP SAMM</strong> y <strong>Microsoft SDL</strong>.</li></ul><h2><strong>Fases del Secure SDLC</strong></h2><ul><li><strong>Formación y concienciación</strong><ul><li>Actividad: capacitar al equipo en codificación segura</li><li>Importancia: los desarrolladores entienden las amenazas desde el inicio.</li></ul></li><li><strong>Requisitos</strong><ul><li>Actividad: definir requisitos de seguridad, perfil de riesgo y modelado de amenazas inicial.</li><li>Importancia: establece las bases de seguridad que debe cumplir la app.</li></ul></li><li><strong>Diseño</strong><ul><li>Actividad: modelado de amenazas, principios de diseño seguro y frameworks seguros.</li><li>Importancia: evita fallos de arquitectura, que son costosos de corregir después.</li></ul></li><li><strong>Implementación</strong><ul><li>Actividad: codificación segura, SAST, validar entradas y codificar salidas.</li><li>Importancia: reduce los bugs de seguridad comunes al programar.</li></ul></li><li><strong>Verificación</strong><ul><li>Actividad: SAST, DAST, pentesting y revisión de código.</li><li>Importancia: comprueba que los controles funcionan y descubre vulnerabilidades no detectadas.</li></ul></li><li><strong>Despliegue</strong><ul><li>Actividad: configurar el entorno de forma segura y desplegar con un proceso seguro.</li><li>Importancia: evita que una mala configuración exponga la app.</li></ul></li><li><strong>Operaciones y mantenimiento</strong><ul><li>Actividad: monitorear, plan de respuesta a incidentes y parches oportunos.</li><li>Importancia: la app sigue segura frente a amenazas nuevas.</li></ul></li></ul><h2><strong>OWASP SAMM (Software Assurance Maturity Model)</strong></h2><ul><li>Marco abierto para <strong>evaluar, formular e implementar</strong> un plan de seguridad de software.</li><li>Agnóstico a la tecnología y al proceso (cascada, ágil, DevOps).</li><li>Sirve para medir y mejorar la seguridad en empresas de cualquier tamaño.</li><li><strong>5 funciones de negocio</strong>:<ul><li><strong>Gobernanza:</strong> estrategia y métricas, política y cumplimiento, educación y guía.</li><li><strong>Diseño:</strong> evaluación de amenazas, requisitos de seguridad, arquitectura segura.</li><li><strong>Implementación:</strong> construcción segura, despliegue seguro, gestión de defectos.</li><li><strong>Verificación:</strong> evaluación de arquitectura, pruebas basadas en requisitos, pruebas de seguridad.</li><li><strong>Operaciones:</strong> gestión de incidentes, gestión del entorno, gestión operacional.</li></ul></li><li>Cada práctica tiene 2 “flujos”.</li><li><strong>Niveles de madurez:</strong><ul><li>Nivel 0: práctica no cumplida (punto de partida).</li><li>Nivel 1: comprensión básica, implementación ad hoc.</li><li>Nivel 2: implementación más sistemática.</li><li>Nivel 3: comprensión exhaustiva, funciona de forma eficiente a escala.</li></ul></li></ul><h2><strong>Microsoft SDL (Security Development Lifecycle)</strong></h2><ul><li>Proceso que integra <strong>seguridad y privacidad</strong> en cada fase del desarrollo.</li><li>Sirve para cualquier metodología (cascada, ágil, DevOps).</li><li>Es evolutivo: se actualiza con nuevas técnicas y amenazas.</li><li><strong>10 prácticas clave:</strong><ol type=\"1\"><li>Establecer estándares de seguridad, métricas y gobernanza.</li><li>Usar características, lenguajes y marcos de seguridad probados.</li><li>Revisión de diseño de seguridad y modelado de amenazas.</li><li>Definir y usar estándares de criptografía.</li><li>Asegurar la cadena de suministro de software.</li><li>Asegurar el entorno de ingeniería.</li><li>Realizar pruebas de seguridad.</li><li>Garantizar la seguridad de la plataforma operativa.</li><li>Implementar monitoreo y respuesta de seguridad.</li><li>Proporcionar capacitación en seguridad.</li></ol></li></ul>"};
RES[2]=`<h1>2. Fundamentos de la programación segura</h1>
<h2>Idea general</h2><ul><li>Son principios y prácticas para <strong>prevenir vulnerabilidades desde el código</strong>.</li><li>Un desarrollador seguro debe conocerlos para hacer apps resistentes a ataques.</li></ul>
<h2>2.1 Principios clave</h2><ul>
<li><strong>Tríada CIA</strong> (proteger los datos)<ul><li><strong>Confidencialidad:</strong> solo los autorizados ven la información.</li><li><strong>Integridad:</strong> los datos no se alteran sin permiso.</li><li><strong>Disponibilidad:</strong> el acceso está listo cuando se necesita.</li></ul></li>
<li><strong>Tríada AAA</strong> (controlar a las personas)<ul><li><strong>Autenticación:</strong> ¿quién eres?</li><li><strong>Autorización:</strong> ¿qué puedes hacer?</li><li><strong>Auditoría:</strong> se registra lo que hiciste.</li></ul></li>
<li><strong>Mínimo privilegio:</strong> cada usuario o proceso tiene solo los permisos necesarios, así el daño es menor si lo comprometen.</li>
<li><strong>Defensa en profundidad:</strong> varias capas de seguridad; si una falla, otra protege.</li>
<li><strong>No confiar en la entrada del usuario:</strong> todo dato externo se valida antes de usarse.</li>
<li><strong>Seguridad por defecto (Fail-Safe / Fail-Secure):</strong> si algo falla, el sistema queda seguro (por ejemplo, niega el acceso).</li>
<li><strong>Separación de responsabilidades:</strong> una tarea crítica se divide entre varios, para que nadie pueda comprometerla solo.</li>
<li><strong>Simplicidad:</strong> lo simple tiene menos errores y es más fácil de revisar.</li>
<li><strong>Seguridad por oscuridad:</strong> <strong>NO es válida</strong>. No se puede confiar solo en que el diseño sea secreto.</li></ul>
<h2>2.2 Validación de entradas y salidas</h2><ul>
<li><strong>Entradas (validar)</strong><ul><li><strong>Para qué:</strong> evitar inyecciones (SQL, XSS, comandos) y desbordamientos de búfer.</li><li><strong>Qué se valida:</strong> tipo, longitud, formato, rango y caracteres permitidos.</li><li><strong>Cómo:</strong><ul><li><strong>Listas blancas:</strong> se permite solo lo válido y se rechaza el resto (mejor que las listas negras).</li><li><strong>En el servidor:</strong> la validación del cliente se puede saltar.</li><li><strong>Tipo, rango y longitud:</strong> ej. entero, número dentro de un límite, texto no demasiado largo.</li><li><strong>Personalizada:</strong> reglas de negocio (ej. que el usuario no exista ya).</li></ul></li></ul></li>
<li><strong>Salidas (codificar)</strong><ul><li><strong>Para qué:</strong> evitar XSS, para que el dato se muestre como <strong>texto</strong> y no como código.</li><li><strong>Cómo:</strong> codificar caracteres especiales (&lt;, &gt;, &amp;) según el contexto: HTML, JavaScript, URL o CSS.</li></ul></li>
<li><strong>Para memorizar:</strong> entrada = <strong>validar</strong>, salida = <strong>codificar</strong>.</li></ul>
<h2>2.3 Prácticas de codificación segura</h2><ul>
<li><strong>10 prácticas de OWASP</strong><ul><li>1. Definir requisitos de seguridad.</li><li>2. Usar frameworks y librerías seguras.</li><li>3. Asegurar la base de datos (consultas parametrizadas y mínimo privilegio).</li><li>4. Codificar y escapar datos.</li><li>5. Validar todas las entradas.</li><li>6. Identidad digital segura (autenticación y sesiones).</li><li>7. Controles de acceso en cada solicitud.</li><li>8. Proteger los datos (cifrar en tránsito y en reposo).</li><li>9. Registro y monitoreo de seguridad.</li><li>10. Manejar errores sin revelar información sensible.</li></ul></li>
<li><strong>CWE/SANS Top 25:</strong> lista de los errores de software más peligrosos. Ejemplos:<ul><li>Inyección SQL (CWE-89)</li><li>XSS (CWE-79)</li><li>Desbordamiento de búfer (CWE-120)</li><li>Manejo incorrecto de errores (CWE-390)</li><li>Credenciales hardcodeadas (CWE-798)</li></ul></li>
<li><strong>Recomendación:</strong> reducir lo que aparece en el OWASP Top 10 y en el CWE/SANS Top 25, y usar librerías ya probadas.</li></ul>
<h2>Idea final</h2><ul><li>Estos fundamentos no dan seguridad absoluta, pero <strong>reducen mucho</strong> las vulnerabilidades.</li><li>Mentalidad clave: <strong>todo dato externo puede ser malicioso hasta que se demuestre lo contrario.</strong></li></ul>`;
RES[3]=`<h1>3. Pruebas estáticas y dinámicas (SAST/DAST)</h1>
<h2>Idea general</h2><ul><li>Las pruebas de seguridad buscan vulnerabilidades <strong>antes de que las exploten</strong>. Son parte clave del Secure SDLC.</li><li>Las principales: <strong>SAST, DAST e IAST</strong>.</li></ul>
<h2>3.1 SAST (estático, “caja blanca”)</h2><ul>
<li><strong>Qué es:</strong> analiza el código fuente, bytecode o binario <strong>sin ejecutar</strong> la app.</li>
<li><strong>Cómo:</strong> busca patrones de código inseguro (inyección SQL, desbordamiento de búfer, XXE).</li>
<li><strong>Ventajas</strong><ul><li>Detección temprana, incluso en el IDE (más barato corregir).</li><li>Analiza el 100% del código.</li><li>No necesita la app en ejecución.</li><li>Ayuda a aprender codificación segura.</li></ul></li>
<li><strong>Desventajas</strong><ul><li>Más falsos positivos.</li><li>Depende del lenguaje.</li><li>No detecta errores de configuración ni de ejecución.</li></ul></li>
<li><strong>Cuándo:</strong> en el IDE, en cada commit y en el pipeline CI/CD. Si solo se usa en CI/CD, los hallazgos se acumulan y abruman al equipo.</li></ul>
<h2>3.2 DAST (dinámico, “caja negra”)</h2><ul>
<li><strong>Qué es:</strong> prueba la app <strong>en ejecución</strong>, enviando entradas maliciosas simuladas. No necesita el código.</li>
<li><strong>Cómo:</strong> simula ataques externos (XSS, inyección SQL, autenticación rota, cifrado, mala configuración del servidor).</li>
<li><strong>Ventajas</strong><ul><li>Menos falsos positivos.</li><li>Independiente del lenguaje.</li><li>Detecta fallos de ejecución y configuración.</li></ul></li>
<li><strong>Desventajas</strong><ul><li>Detección tardía (corregir cuesta más).</li><li>No cubre todo el código.</li><li>Puede ser más lento.</li><li>Interpretar los informes requiere conocimiento de seguridad.</li></ul></li>
<li><strong>Cuándo:</strong> en la fase de pruebas (entorno de prueba), o en producción con cuidado. También en CI/CD.</li></ul>
<h2>3.3 IAST (interactivo)</h2><ul>
<li><strong>Qué es:</strong> combina SAST y DAST. Trabaja <strong>dentro</strong> de la app en ejecución, con agentes, mientras se usa.</li>
<li><strong>Ventajas</strong><ul><li>Cobertura completa.</li><li>Detección en tiempo real.</li><li>Más precisión y menos falsos positivos.</li><li>Ve cómo fluyen los datos.</li></ul></li>
<li><strong>Desventajas</strong><ul><li>Afecta el rendimiento.</li><li>Más costo y complejidad.</li></ul></li>
<li><strong>Cuándo:</strong> de forma continua, sobre todo en QA y staging.</li></ul>
<h2>3.4 SAST vs DAST</h2>
<div style="overflow-x:auto"><table><tr><th></th><th>SAST (caja blanca)</th><th>DAST (caja negra)</th></tr>
<tr><td>Qué escanea</td><td>Código fuente, bytecode, binarios</td><td>App en ejecución, APIs</td></tr>
<tr><td>Cuándo</td><td>Temprano (codificación, commit)</td><td>Tarde (pruebas, post-despliegue)</td></tr>
<tr><td>Acceso al código</td><td>Requerido</td><td>No requerido</td></tr>
<tr><td>Falsos positivos</td><td>Más</td><td>Menos</td></tr>
<tr><td>Falsos negativos</td><td>Menos (en lo que cubre)</td><td>Más (si no se prueba el flujo)</td></tr>
<tr><td>Lenguaje</td><td>Específico</td><td>Independiente</td></tr>
<tr><td>Qué encuentra</td><td>Errores de codificación, inyecciones (potenciales), desbordamientos</td><td>XSS, SQLi (reales), mala configuración, autenticación rota</td></tr>
<tr><td>Velocidad</td><td>Más rápido</td><td>Más lento</td></tr></table></div>
<ul><li><strong>Para memorizar:</strong> SAST = por <strong>dentro</strong> (el código). DAST = por <strong>fuera</strong> (la app corriendo).</li></ul>
<h2>3.5 Herramientas</h2><ul>
<li><strong>SAST open source</strong><ul><li><strong>GolangCI-Lint:</strong> proyectos Go.</li><li><strong>PHPStan:</strong> código PHP.</li><li><strong>Brakeman:</strong> Ruby on Rails (SQLi, XSS).</li><li><strong>Bandit:</strong> Python.</li><li><strong>PMD:</strong> más de 15 lenguajes.</li><li><strong>SonarQube:</strong> calidad continua del código, también hace SAST.</li></ul></li>
<li><strong>DAST open source</strong><ul><li><strong>OWASP ZAP:</strong> muy popular y completa, mantenida por OWASP.</li><li><strong>Arachni:</strong> framework de escaneo web.</li></ul></li>
<li><strong>Comerciales</strong><ul><li><strong>Parasoft:</strong> SAST, DAST.</li><li><strong>Veracode:</strong> SAST, DAST, SCA.</li><li><strong>Checkmarx:</strong> SAST, DAST, IAST, SCA.</li><li><strong>HCL AppScan:</strong> SAST, DAST, IAST.</li><li><strong>Qualys Web Application Scanning</strong></li><li><strong>Invicti</strong> (antes Netsparker): DAST.</li><li><strong>GitLab Ultimate:</strong> SAST, DAST, dependencias y secretos.</li><li><strong>Snyk:</strong> SCA, SAST.</li><li><strong>JFrog Xray:</strong> SCA.</li></ul></li></ul>
<h2>Idea final</h2><ul><li>SAST, DAST e IAST <strong>no se excluyen</strong>: se combinan en distintas etapas del SDLC.</li><li>SAST da respuesta temprana, DAST valida la app en ejecución e IAST da una visión más profunda en las pruebas funcionales.</li><li>La clave: dar información útil <strong>sin abrumar</strong> al equipo.</li></ul>`;
RES[4]="<h1>4. Seguridad en aplicaciones web</h1><h2>Web Application Security (Seguridad en Aplicaciones Web)</h2><p>OWASP es una comunidad que publica la lista de los 10 riesgos más graves en webs (OWASP Top 10 2021).</p><ol type=\"1\"><li><strong>A01:2021-Broken Access Control (Control de Acceso Roto):</strong> el usuario hace cosas que no debería (ver datos de otros, entrar a /admin). <em>Solución:</em> negar por defecto y validar siempre en el servidor.</li><li><strong>A02:2021-Cryptographic Failures (Fallos Criptográficos):</strong> datos sin cifrar o con cifrado débil (HTTP, MD5, claves en el código). <em>Solución:</em> TLS, AES-256 y contraseñas con bcrypt/Argon2.</li><li><strong>A03:2021-Injection (Inyección):</strong> datos del usuario se ejecutan como comandos (SQL, XSS, comandos del sistema). <em>Solución:</em> consultas parametrizadas y codificar la salida.</li><li><strong>A04:2021-Insecure Design (Diseño Inseguro):</strong> el error está en el diseño, no en el código. <em>Solución:</em> modelar amenazas desde el inicio.</li><li><strong>A05:2021-Security Misconfiguration (Configuración de Seguridad Incorrecta):</strong> contraseñas por defecto, errores muy detallados, servicios innecesarios. <em>Solución:</em> hardening y mensajes genéricos.</li><li><strong>A06:2021-Vulnerable and Outdated Components (Componentes Vulnerables y Desactualizados):</strong> librerías viejas con fallos conocidos (Equifax, WannaCry). <em>Solución:</em> inventario, escaneo (SCA) y parchear.</li><li><strong>A07:2021-Identification and Authentication Failures (Fallos de Identificación y Autenticación):</strong> contraseñas débiles, fuerza bruta, sesiones mal manejadas. <em>Solución:</em> MFA, límite de intentos y sesiones seguras.</li><li><strong>A08:2021-Software and Data Integrity Failures (Fallos de Integridad de Software y Datos):</strong> confiar en actualizaciones o datos sin verificarlos (SolarWinds, deserialización). <em>Solución:</em> firmas digitales y CI/CD seguro.</li><li><strong>A09:2021-Security Logging and Monitoring Failures (Fallos de Registro y Monitoreo de Seguridad):</strong> no se registran ni vigilan los ataques, así que no se detectan. <em>Solución:</em> logs, alertas y plan de respuesta.</li><li><strong>A10:2021-Server-Side Request Forgery (SSRF) (Falsificación de Solicitudes del Lado del Servidor):</strong> el servidor hace peticiones a URLs que el atacante elige (servicios internos, metadatos de la nube). <em>Solución:</em> lista blanca de URLs y segmentar la red.</li></ol><p><strong>Idea clave:</strong> los riesgos están conectados, por eso se necesita defensa en profundidad.</p>";
RES[5]="<h1>5. Desarrollo seguro de aplicaciones móviles</h1><h2>Mobile Application Security (Seguridad en Aplicaciones Móviles)</h2><p>Riesgos propios de Android e iOS (OWASP Mobile Top 10 2024).</p><ul><li><strong>M1: Improper Credential Usage (Uso Inadecuado de Credenciales):</strong> claves escritas en el código o guardadas sin cifrar. <em>Solución:</em> Keystore/Keychain.</li><li><strong>M2: Inadequate Supply Chain Security (Seguridad Inadecuada de la Cadena de Suministro):</strong> SDKs y librerías de terceros maliciosos o vulnerables. <em>Solución:</em> revisar y vigilar cada componente.</li><li><strong>M3: Insecure Authentication/Authorization (Autenticación/Autorización Insegura):</strong> validar solo en la app. <em>Solución:</em> validar siempre en el backend.</li><li><strong>M4: Insufficient Input/Output Validation (Validación Insuficiente de Entradas/Salidas):</strong> no filtrar datos (deeplinks, WebViews, SQLi). <em>Solución:</em> validar y sanitizar todo.</li><li><strong>M5: Insecure Communication (Comunicación Insegura):</strong> HTTP o certificados falsos aceptados (MitM). <em>Solución:</em> TLS 1.2+ y certificate pinning.</li><li><strong>M6: Inadequate Privacy Controls (Controles de Privacidad Inadecuados):</strong> pedir o exponer más datos personales de los necesarios. <em>Solución:</em> minimizar datos y permisos.</li><li><strong>M7: Insufficient Binary Protections (Protecciones Binarias Insuficientes):</strong> apps fáciles de decompilar y modificar. <em>Solución:</em> ofuscación, anti-tampering, detección de root.</li><li><strong>M8: Security Misconfiguration (Configuración de Seguridad Incorrecta):</strong> modo debug activo, componentes expuestos, backups abiertos. <em>Solución:</em> mínimos permisos y endurecer el manifiesto.</li><li><strong>M9: Insecure Data Storage (Almacenamiento Inseguro de Datos):</strong> datos sensibles sin cifrar en el dispositivo. <em>Solución:</em> cifrar y usar almacenamiento interno.</li><li><strong>M10: Insufficient Cryptography (Criptografía Insuficiente):</strong> algoritmos rotos (DES, MD5), IVs predecibles. <em>Solución:</em> AES-GCM, CSPRNG y KDFs.</li></ul><p><strong>Idea clave:</strong> los riesgos se conectan (M1, M7, M9, M10 se relacionan) y la cadena de suministro (M2) es crítica: usar “confianza cero”.</p>";
RES[6]="<h1>6. Desarrollo seguro de APIs</h1><h2>Secure API Development (Desarrollo Seguro de APIs)</h2><p>Las APIs conectan todo, por eso son un blanco clave (OWASP API Security Top 10 2023).</p><ul><li><strong>API1:2023 Broken Object Level Authorization (BOLA) (Autorización Rota a Nivel de Objeto):</strong> cambiar el ID y ver datos de otro (/users/456). <em>Solución:</em> verificar permisos por objeto y usar UUIDs.</li><li><strong>API2:2023 Broken Authentication (Autenticación Rota):</strong> tokens débiles, API keys expuestas, sin límite de intentos. <em>Solución:</em> OAuth2, JWT firmado y de corta vida, rate limiting.</li><li><strong>API3:2023 Broken Object Property Level Authorization (Autorización Rota a Nivel de Propiedad de Objeto):</strong> mostrar de más (passwordHash) o permitir modificar de más (isAdmin). <em>Solución:</em> listas blancas y DTOs.</li><li><strong>API4:2023 Unrestricted Resource Consumption (Consumo No Restringido de Recursos):</strong> sin rate limit, DoS, costos altos. <em>Solución:</em> límites, cuotas y timeouts.</li><li><strong>API5:2023 Broken Function Level Authorization (Autorización Rota a Nivel de Función):</strong> un usuario normal usa funciones de admin. <em>Solución:</em> negar por defecto y chequeos por rol.</li><li><strong>API6:2023 Unrestricted Access to Sensitive Business Flows (Acceso No Restringido a Flujos de Negocio Sensibles):</strong> bots abusan de compras, cuentas o comentarios. <em>Solución:</em> detección de bots, CAPTCHA, límites por flujo.</li><li><strong>API7:2023 Server-Side Request Forgery (SSRF) (Falsificación de Solicitudes del Lado del Servidor):</strong> la API llama a URLs que el atacante elige. <em>Solución:</em> lista blanca, no seguir redirecciones.</li><li><strong>API8:2023 Security Misconfiguration (Configuración de Seguridad Incorrecta):</strong> CORS abierto, errores detallados, sin HTTPS. <em>Solución:</em> hardening y CORS restrictivo.</li><li><strong>API9:2023 Improper Inventory Management (Gestión Inadecuada de Inventario):</strong> APIs “fantasma” (shadow) o “zombie” olvidadas. <em>Solución:</em> catálogo actualizado y retirar versiones viejas.</li><li><strong>API10:2023 Unsafe Consumption of APIs (Consumo Inseguro de APIs):</strong> confiar ciegamente en datos de terceros. <em>Solución:</em> tratarlos como no confiables, validar y usar timeouts.</li></ul><p><strong>Idea clave:</strong> proteger toda la superficie de ataque, no solo un endpoint.</p>";
RES[7]="<h1>7. DevSecOps: desarrollo, seguridad y operaciones</h1><h2>DevSecOps (Desarrollo, Seguridad y Operaciones)</h2><ul><li><strong>Qué es:</strong> integrar la seguridad dentro de DevOps (Dev + Sec + Ops) de forma automática. Lema: <em>“seguridad como código”</em>.</li><li><strong>Shared Responsibility Culture (Cultura de Responsabilidad Compartida):</strong> la seguridad es responsabilidad de todos, no una puerta al final. El equipo de seguridad aconseja y facilita.</li><li><strong>Shift Left (Desplazar a la Izquierda):</strong> mover la seguridad lo más temprano posible (diseño y código). Beneficios: <em>más barato, más rápido, mejor calidad</em>.<ul><li><strong>Prácticas comunes:</strong> modelado de amenazas en el diseño, SAST durante la programación y DAST durante las pruebas.</li><li>Se describe como seguridad <strong>proactiva</strong>.</li></ul></li><li><strong>Securing the CI/CD Pipeline (Asegurando el Pipeline de CI/CD), en orden:</strong><ol type=\"1\"><li><strong>Secret Scanning (Análisis de Secretos), pre-commit:</strong> Gitleaks, truffleHog → buscan claves en el código.</li><li><strong>Software Composition Analysis, SCA (Análisis de Composición de Software), build:</strong> Snyk, Dependency-Check → librerías con CVEs.</li><li><strong>Static Application Security Testing, SAST (Análisis Estático de Seguridad de Aplicaciones), build:</strong> SonarQube, Checkmarx → analiza el código fuente.</li><li><strong>Dynamic Application Security Testing, DAST (Análisis Dinámico de Seguridad de Aplicaciones), pruebas:</strong> OWASP ZAP → ataca la app en ejecución.</li><li><strong>Infrastructure as Code Security, IaC (Seguridad de la Infraestructura como Código), deploy:</strong> revisa Terraform, Docker, Kubernetes.</li><li><strong>Production Monitoring (Monitoreo en Producción), post-deploy:</strong> WAF y vigilancia en tiempo real.</li></ol></li></ul><p><strong>Para memorizar el orden:</strong> Secretos → SCA → SAST → DAST → IaC → Monitoreo.</p>";
RES[8]="<h1>8. Seguridad de la IA</h1><h2>AI Security (Seguridad de la IA)</h2><ul><li><strong>Marcos de referencia:</strong><ul><li><strong>MITRE ATLAS (Adversarial Threat Landscape for Artificial-Intelligence Systems):</strong> tácticas y técnicas de ataque a IA, como ATT&amp;CK.</li><li><strong>OWASP Top 10 for LLMs (OWASP Top 10 para Modelos de Lenguaje Grandes):</strong> riesgos propios de los LLMs.</li></ul></li><li><strong>Ataques en fase de entrenamiento:</strong><ul><li><strong>Data Poisoning (Envenenamiento de Datos):</strong> corromper los datos de entrenamiento (ej. gatos etiquetados como perros). <em>Solución:</em> validar la cadena de datos.</li></ul></li><li><strong>Ataques en fase de inferencia (modelo en uso):</strong><ul><li><strong>Adversarial Evasion Attacks (Ataques Adversariales de Evasión):</strong> cambios mínimos que engañan al modelo (pegatina en señal STOP).</li><li><strong>Membership Inference (Inferencia de Membresía):</strong> saber si un dato estuvo en el entrenamiento.</li><li><strong>Model Inversion (Inversión de Modelo):</strong> reconstruir datos de entrenamiento.</li><li><strong>Model Theft (Robo de Modelo):</strong> copiar el modelo (pesos o por la API).</li></ul></li><li><strong>OWASP LLM clave:</strong><ul><li><strong>LLM01: Prompt Injection (Inyección de Prompts):</strong> manipular el prompt para saltarse filtros.</li><li><strong>LLM02: Insecure Output Handling (Manejo Inseguro de Salidas):</strong> usar la salida del LLM sin sanitizar (XSS).</li><li><strong>LLM04: Model Denial of Service (Denegación de Servicio del Modelo):</strong> prompts que gastan muchos recursos.</li><li><strong>LLM06: Sensitive Information Disclosure (Fuga de Información Sensible):</strong> el modelo revela datos confidenciales.</li><li><strong>LLM08: Excessive Agency (Agencia Excesiva):</strong> demasiados permisos para el LLM.</li><li><strong>LLM09: Overreliance (Confianza Excesiva):</strong> creer la salida sin revisarla.</li></ul></li></ul>";
RES[9]="<h1>9. Vulnerabilidades de sitios web</h1><h2>Website Vulnerabilities (Vulnerabilidades de Sitios Web)</h2><ul><li><strong>SQL Injection (Inyección SQL):</strong> el atacante escribe código SQL en un formulario o URL para manipular la base de datos.</li><li><strong>Path Traversal (Recorrido de Rutas):</strong> el atacante intenta acceder a archivos del sistema.</li><li><strong>Command Injection (Inyección de Comandos):</strong> el sistema ejecuta comandos del sistema operativo que puso el atacante.</li><li><strong>Cross-Site Scripting, XSS (Secuencias de Comandos entre Sitios):</strong> el atacante mete JavaScript que se ejecuta en el navegador de otro usuario. Puede robar cookies o sesiones.</li><li><strong>Cross-Site Request Forgery, CSRF (Falsificación de Solicitudes entre Sitios):</strong> un sitio engaña al usuario para que haga una acción sin darse cuenta.</li><li><strong>Brute Force Attacks (Ataques de Fuerza Bruta):</strong> probar miles de contraseñas hasta dar con la correcta.</li><li><strong>Buffer Overflow (Desbordamiento de Buffer):</strong> el programa guarda más datos de los que cabe en el buffer. Permite ejecutar código del atacante.</li></ul><p><strong>Defensa para inyecciones y XSS:</strong> validar y sanitizar las entradas.</p>";
RES[10]="<h1>10. Ataques</h1><h2>Attacks (Ataques)</h2><ul><li><strong>Malware:</strong> software malicioso para dañar o controlar sistemas.</li><li><strong>Virus:</strong> infecta archivos y necesita que el usuario lo ejecute.</li><li><strong>Worm (Gusano):</strong> se copia y se propaga solo por la red, sin que el usuario haga nada.</li><li><strong>Trojan (Troyano):</strong> parece seguro, pero abre una puerta trasera.</li><li><strong>Spyware:</strong> espía y roba información del usuario.</li><li><strong>Adware:</strong> muestra publicidad invasiva.</li><li><strong>Ransomware:</strong> secuestra los datos y pide rescate.</li><li><strong>Doxing:</strong> publicar información privada para intimidar o dañar.</li><li><strong>Phishing:</strong> engaño para robar datos suplantando a alguien.</li><li><strong>DDoS (Denegación de Servicio Distribuida):</strong> saturar un servidor con peticiones hasta que cae.</li><li><strong>SQL Injection (Inyección SQL):</strong> código SQL para acceder o dañar la base de datos.</li><li><strong>Whaling (Caza de Ballenas):</strong> ataque dirigido a altos ejecutivos para robar información crítica.</li><li><strong>Pentesting (Pruebas de Penetración):</strong> ataque <strong>controlado</strong> para encontrar vulnerabilidades antes que los malos.</li></ul><p><strong>Truco:</strong> virus = necesita ayuda; gusano = se mueve solo; troyano = se disfraza.</p>";
RES[11]="<h1>11. Tipos de pruebas de seguridad</h1><h2>Types of Security Testing (Tipos de Pruebas de Seguridad)</h2><ul><li><strong>AST, Application Security Testing (Pruebas de Seguridad en Aplicaciones):</strong> busca e identifica vulnerabilidades. Es indispensable en el desarrollo.</li><li><strong>SAST (Análisis Estático):</strong> <em>White Box (caja blanca)</em>. Analiza el código fuente de adentro hacia afuera, durante la programación y antes de compilar o desplegar.</li><li><strong>DAST (Análisis Dinámico):</strong> <em>Black Box (caja negra)</em>. Analiza la app en ejecución de afuera hacia adentro, en la fase de pruebas.</li><li><strong>SCA, Software Composition Analysis (Análisis de Composición de Software):</strong> identifica componentes de código abierto y su riesgo.</li></ul><p><strong>Según lo que el tester conoce:</strong></p><ul><li><strong>Black Box (Caja Negra):</strong> no ve código, arquitectura ni base de datos. Actúa como atacante externo. Se usa en DAST, pentesting y pruebas de APIs.</li><li><strong>White Box (Caja Blanca):</strong> ve código fuente, arquitectura y configuración. Busca inyecciones, errores de lógica, problemas de cifrado y fallos de autorización.</li><li><strong>Gray Box (Caja Gris):</strong> acceso parcial (credenciales, documentación, acceso limitado). Simula a un usuario interno.</li></ul>";
RES[12]="<h1>12. Modelos de amenazas</h1><h2>Threat Models (Modelos de Amenazas)</h2><ul><li><strong>STRIDE:</strong> identifica y clasifica amenazas. Se usa en la fase de <strong>diseño</strong>.<ul><li><strong>S</strong>poofing (Suplantación de identidad)</li><li><strong>T</strong>ampering (Manipulación no autorizada)</li><li><strong>R</strong>epudiation (Repudio: negar haber hecho una acción; se necesita poder demostrarla)</li><li><strong>I</strong>nformation Disclosure (Exposición de información sensible)</li><li><strong>D</strong>enial of Service (Denegación de Servicio: el sistema deja de estar disponible)</li><li><strong>E</strong>levation of Privilege (Elevación de Privilegios: obtener más permisos de los autorizados)</li></ul></li><li><strong>DREAD:</strong> evalúa el riesgo <strong>después</strong> de identificar las amenazas. Mide impacto y riesgo.<ul><li><strong>D</strong>amage Potential (Potencial de daño)</li><li><strong>R</strong>eproducibility (Reproducibilidad: qué tan fácil es repetir el ataque)</li><li><strong>E</strong>xploitability (Explotabilidad: qué tan fácil es explotarla)</li><li><strong>A</strong>ffected Users (Usuarios afectados)</li><li><strong>D</strong>iscoverability (Descubribilidad: qué tan fácil es encontrar la falla)</li></ul></li></ul><p><strong>Truco:</strong> STRIDE = <em>encontrar</em> amenazas; DREAD = <em>medir</em> qué tan graves son.</p>";
RES[13]="<h1>13. Principios para proteger aplicaciones y sistemas</h1><h2>Principles to Protect Applications (Principios para Proteger Aplicaciones y Sistemas)</h2><ul><li><strong>PoLP, Principle of Least Privilege (Principio de Mínimo Privilegio):</strong> dar al usuario solo los permisos mínimos.</li><li><strong>WAF, Web Application Firewall (Firewall de Aplicaciones Web):</strong> protege las apps web de ataques y tráfico no deseado.</li><li><strong>MFA, Multi-Factor Authentication (Autenticación Multifactor):</strong> pide más de una prueba de identidad.</li><li><strong>CSRF (Falsificación de Solicitudes entre Sitios):</strong> el usuario, ya logueado, ejecuta acciones sin darse cuenta.</li><li><strong>Secure Software Development (Desarrollo Seguro de Software):</strong> pensar en seguridad desde el inicio, no solo al final.</li><li><strong>Defense in Depth (Defensa en Profundidad):</strong> varias capas de seguridad por si una falla.</li><li><strong>Hardening (Endurecimiento):</strong> reforzar sistemas y apps para reducir vulnerabilidades.</li></ul>";
RES[14]="<h1>14. APIs</h1><h2>APIs (Interfaces de Programación de Aplicaciones)</h2><p>Permiten que distintas aplicaciones se comuniquen entre sí.</p><ul><li><strong>REST:</strong> usa HTTP (GET, POST, PUT, DELETE) y se basa en recursos. Es <em>stateless</em>, flexible y el más usado.</li><li><strong>SOAP:</strong> basado en XML, estricto y formal. Muy usado en empresas y finanzas por su seguridad y estándares.</li><li><strong>GraphQL:</strong> el cliente pide solo los datos que necesita, sin información de más.</li><li><strong>RPC:</strong> el cliente llama funciones del servidor directamente. <strong>gRPC</strong> es su versión moderna, rápida y eficiente.</li></ul><p><strong>Para memorizar:</strong> REST = recursos + HTTP · SOAP = XML + estándares · GraphQL = datos exactos · RPC/gRPC = llamadas a funciones.</p>";
RES[15]="<h1>15. Seguridad en la nube</h1><h2>Cloud Security (Seguridad en la Nube)</h2><p>Medidas y controles que protegen datos, aplicaciones e infraestructura en la nube.</p><ul><li><strong>Shared Responsibility Model (Modelo de Responsabilidad Compartida):</strong><ul><li><strong>Proveedor:</strong> protege la infraestructura física, la red, la virtualización y los servicios gestionados.</li><li><strong>Cliente:</strong> protege la configuración, los accesos, los datos, las aplicaciones y los sistemas operativos.</li></ul></li><li><strong>Áreas clave:</strong><ul><li><strong>IAM, Identity and Access Management (Gestión de Identidad y Acceso):</strong> quién accede a cada recurso.</li><li><strong>Data Security (Seguridad de Datos):</strong> cifrado en tránsito y en reposo.</li><li><strong>Network Security (Seguridad de la Red):</strong> firewalls, reglas de red y controles de acceso.</li><li><strong>Workload Protection (Protección de Cargas de Trabajo):</strong> máquinas virtuales, contenedores y serverless.</li><li><strong>Monitoring and Threat Detection (Monitoreo y Detección de Amenazas):</strong> vigilancia constante de actividad sospechosa.</li></ul></li></ul>";
RES[16]="<h1>16. HTTPS y TLS</h1><h2>HTTPS and TLS (Protocolos de Seguridad Web HTTPS y TLS)</h2><ul><li><strong>HTTPS:</strong> la versión segura de HTTP. Protege la comunicación entre navegador y servidor.</li><li><strong>TLS (Transport Layer Security):</strong> el protocolo de cifrado que usa HTTPS.<ul><li>Protege los datos <strong>en tránsito</strong>.</li><li>Previene sobre todo ataques de interceptación (Man-in-the-Middle).</li><li>Usa certificados digitales para autenticar al servidor.</li><li>Antes de confiar, se verifica que el certificado esté firmado por una <strong>CA (Autoridad Certificadora)</strong> confiable.</li><li>Si el certificado es inválido, el navegador muestra una advertencia.</li></ul></li><li><strong>Las 3 protecciones de TLS:</strong><ol type=\"1\"><li><strong>Encryption (Cifrado):</strong> nadie más puede leer los datos.</li><li><strong>Integrity (Integridad):</strong> los datos no se alteran en el camino.</li><li><strong>Authentication (Autenticación):</strong> el sitio es legítimo, gracias a los certificados.</li></ol></li><li><strong>TLS Handshake (Apretón de Manos TLS):</strong> proceso inicial donde cliente y servidor acuerdan cómo proteger la conexión. Se negocian algoritmos y claves. El cifrado de datos empieza <strong>después</strong> del handshake.</li></ul>";
RES[17]="<h1>17. ACID</h1><h2>ACID (Propiedades de las Transacciones en Bases de Datos)</h2><p>Garantizan transacciones confiables y evitan corrupción y pérdida de datos.</p><ul><li><strong>A, Atomicity (Atomicidad):</strong> todo se ejecuta o nada. No quedan datos a medias.</li><li><strong>C, Consistency (Consistencia):</strong> la base de datos pasa de un estado válido a otro válido.</li><li><strong>I, Isolation (Aislamiento):</strong> una transacción no interfiere con otra.</li><li><strong>D, Durability (Durabilidad):</strong> lo guardado no se pierde, aunque falle el sistema.</li></ul>";
const $=s=>document.querySelector(s),app=$("#app"),KEY="quizDS_v1";
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S={mode:"quiz",topic:"all",pool:[],i:0,ci:0,ok:0,bad:[],sel:null,ck:false,flip:false};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({m:S.mode,t:S.topic,p:S.pool.map(p=>[p.k,p.o]),i:S.i,ci:S.ci,ok:S.ok,b:S.bad,s:S.sel,c:S.ck}))}catch(e){}};
function load(){try{const r=JSON.parse(localStorage.getItem(KEY)||"null");
 if(!r||!Array.isArray(r.p)||!r.p.length||!r.p.every(([k,o])=>D[k]&&Array.isArray(o)&&o.length==4))return false;
 S.pool=r.p.map(([k,o])=>({k,d:D[k],o}));Object.assign(S,{mode:r.m||"quiz",topic:r.t||"all",i:r.i|0,ci:r.ci|0,ok:r.ok|0,bad:(r.b||[]).filter(k=>D[k]),sel:r.s,ck:!!r.c,flip:false});return true}catch(e){return false}}
function build(keys){S.pool=sh(keys).map(k=>({k,d:D[k],o:sh(D[k].slice(2))}));Object.assign(S,{i:0,ci:0,ok:0,bad:[],sel:null,ck:false,flip:false});draw()}
const src=()=>D.map((d,k)=>k).filter(k=>S.topic=="all"||D[k][0]==S.topic);
function head(){
 $("#modes").innerHTML=[["quiz","📝 Quiz"],["cards","🗂️ Tarjetas"],["doc","📖 Resumen"]].map(([k,l])=>`<button class="tab" aria-pressed="${S.mode==k}" data-m="${k}">${l}</button>`).join("")+(S.mode!="doc"?`<button class="tab" data-a="mix">🔀 Nuevo intento</button>`:"");
 $("#topics").innerHTML=[["all","Todos ("+D.length+")"],...Object.entries(T).map(([k,v])=>[k,v+(D.some(d=>d[0]==k)?" ("+D.filter(d=>d[0]==k).length+")":" · solo resumen")])].map(([k,l])=>`<button class="chip" aria-pressed="${S.topic==k}" data-t="${k}">${l}</button>`).join("")}
function draw(){head();save();const n=S.pool.length;
 if(S.mode=="doc"){app.innerHTML=`<div class="card res">${Object.keys(RES).filter(k=>S.topic=="all"||S.topic==k).map(k=>RES[k]).join("<hr>")}</div>`;return}
 if(!n){app.innerHTML=`<div class="card"><p class="q">Aún no hay preguntas para este tema.</p><p>Por ahora puedes leer su resumen en la pestaña 📖 Resumen.</p></div>`;return}
 if(S.mode=="cards"){const c=Math.min(S.ci,n-1),d=S.pool[c].d;
  app.innerHTML=`<div class="bar"><i style="width:${(c+1)/n*100}%"></i></div><div class="meta"><span>Tarjeta ${c+1} de ${n}</span><span>${T[d[0]]}</span></div>
  <div class="card fc ${S.flip?"back":""}" data-f="1">${S.flip?`<small>Respuesta</small><p class="q">${d[2]}</p>`:`<small>Pregunta · toca para voltear</small><p class="q">${d[1]}</p>`}</div>
  <div class="row"><button class="btn" data-a="prev" ${c?"":"disabled"}>← Anterior</button><button class="btn p" data-a="next" ${c<n-1?"":"disabled"}>Siguiente →</button><button class="btn" data-a="mix">🔀 Mezclar</button></div>`;return}
 if(S.i>=n){const pct=Math.round(S.ok/n*100);
  app.innerHTML=`<div class="card"><div class="meta"><span>Resultado</span></div><div class="big">${S.ok} / ${n} · ${pct}%</div><p>${pct>=80?"¡Excelente! Ya dominas este tema.":pct>=60?"Vas bien. Repasa las falladas.":"Repasa con las tarjetas y vuelve a intentarlo."}</p>
  <div class="row"><button class="btn p" data-a="mix">🔀 Mezclar y reiniciar</button>${S.bad.length?`<button class="btn" data-a="retry">Repetir falladas (${S.bad.length})</button>`:""}</div>
  ${S.bad.map(k=>`<div class="li">${D[k][1]}<br><b>✔ ${D[k][2]}</b></div>`).join("")}</div>`;return}
 const p=S.pool[S.i],d=p.d,good=S.ck&&p.o[S.sel]==d[2];
 app.innerHTML=`<div class="bar"><i style="width:${S.i/n*100}%"></i></div><div class="meta"><span>Pregunta ${S.i+1} de ${n}</span><span>Aciertos: ${S.ok}</span></div>
 <div class="card"><span class="tag">${T[d[0]]}</span><p class="q">${d[1]}</p>
 ${p.o.map((o,k)=>`<button class="o ${S.ck?(o==d[2]?"ok":k==S.sel?"no":""):(k==S.sel?"sl":"")}" data-o="${k}" ${S.ck?"disabled":""}>${o}</button>`).join("")}
 ${S.ck?`<div class="fb ${good?"ok":"no"}">${good?"✔ ¡Correcto!":"✘ Incorrecto. La respuesta correcta es: "+d[2]}</div><div class="row"><button class="btn p" data-a="next">${S.i<n-1?"Siguiente →":"Ver resultado"}</button></div>`:`<div class="row"><button class="btn p" data-a="val" ${S.sel===null?"disabled":""}>Validar</button></div>`}</div>`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-m],[data-t],[data-o],[data-a],[data-f]");if(!b)return;const q=b.dataset;
 if(q.m){S.mode=q.m;S.flip=false;draw()}
 else if(q.t){S.topic=q.t;build(src())}
 else if(q.f){S.flip=!S.flip;draw()}
 else if(q.o!==undefined){if(!S.ck){S.sel=+q.o;draw()}}
 else{const a=q.a,cm=S.mode=="cards";
  if(a=="mix")build(src());else if(a=="retry")build(S.bad);
  else if(a=="val"&&S.sel!==null&&!S.ck){const p=S.pool[S.i];S.ck=true;if(p.o[S.sel]==p.d[2])S.ok++;else S.bad.push(p.k);draw()}
  else if(a=="next"){if(cm)S.ci++;else{S.i++;S.sel=null;S.ck=false}S.flip=false;draw()}
  else if(a=="prev"){S.ci--;S.flip=false;draw()}}});
if(load())draw();else build(src());
</script></body></html>
